<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lab-play</title>
<link rel="stylesheet" href="design/tokens.css">
<style>
  /* 主菜单：字少图多。删掉所有说明文字，只留 SVG 纹样 + 名字 + 大留白。
     这是个人游戏系统，玩家只有自己，不需要说明。
     所有取值来自 design/tokens.css，本文件不写死颜色/间距。 */
  .shell {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--sp-9) var(--sp-5) var(--sp-8);
  }

  /* 极简报头：只留一个衬线字标，不带副标题 */
  .masthead {
    margin-bottom: var(--sp-9);
    text-align: center;
  }
  .masthead h1 {
    font-family: var(--font-serif);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-tight);
    margin: 0;
  }

  /* 区块标签：极小、宽字距，作为分区而非解释 */
  .section-label {
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    color: var(--c-text-faint);
    text-align: center;
    margin: var(--sp-8) 0 var(--sp-5);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--sp-5);
  }

  /* 入口卡片：只有图形 + 名字，居中，慷慨留白 */
  .entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-4);
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-xl);
    padding: var(--sp-7) var(--sp-5);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out),
                transform var(--dur-base) var(--ease-out);
  }
  .entry:hover {
    border-color: var(--c-line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
  }
  /* SVG 纹样容器：矢量、随主题色、无外部资源 */
  .entry-glyph {
    width: 72px;
    height: 72px;
    color: var(--c-accent);
  }
  .entry-glyph svg { display: block; width: 100%; height: 100%; }
  .entry:hover .entry-glyph { color: var(--c-accent-hover); }

  .entry-name {
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    font-weight: var(--fw-medium);
    letter-spacing: var(--ls-tight);
  }
</style>
</head>
<body>

<div class="shell">
  <header class="masthead">
    <h1>lab · play</h1>
  </header>

  <div class="section-label">玩法</div>
  <div class="grid" id="playsGrid"></div>

  <div class="section-label">账本</div>
  <div class="grid" id="viewsGrid"></div>
</div>

<script type="module">
// 主菜单由 plays.json 清单驱动：新增一个 play 只需在 plays.json 加一行，
// 这里自动渲染出入口，无需改动本文件。（见 AGENTS.md「如何新增一个 play」）
//
// 字少图多：每个入口只渲染 SVG 纹样 + 名字，不再渲染 desc / 状态标签。
// 图形按 id 从内置的抽象几何纹样里取；没有对应纹样时回退到通用菱形。
// 纹样风格与卡牌世界观一致（菱形/牌形/线条构成），随主题色，非具象工具图标。
const GLYPHS = {
  // 抽卡：一叠错落的牌，暗示“从牌堆抽一张”
  draw: `
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linejoin="round">
      <rect x="9"  y="14" width="20" height="28" rx="3"
            transform="rotate(-9 19 28)"/>
      <rect x="19" y="12" width="20" height="28" rx="3"
            transform="rotate(6 29 26)"/>
      <path d="M29 20 l3.2 6.2 6.8 1 -5 4.7 1.2 6.8 -6.2-3.2 -6.2 3.2 1.2-6.8 -5-4.7 6.8-1 z"
            stroke-width="1.1"/>
    </svg>`,
  // 统计：账本视图，用高低不一的竖线暗示“痕迹汇总”
  stats: `
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 40 h32"/>
      <path d="M14 40 V26"/>
      <path d="M22 40 V16"/>
      <path d="M30 40 V22"/>
      <path d="M38 40 V12"/>
      <path d="M14 26 l8-10 8 6 8-10" stroke-width="1.1"/>
    </svg>`,
};

// 通用回退纹样：一个带内框的菱形牌形，保证未知 id 也有雅致图形
const GLYPH_FALLBACK = `
  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
       stroke-width="1.4" stroke-linejoin="round">
    <path d="M24 5 43 24 24 43 5 24 z"/>
    <path d="M24 13 35 24 24 35 13 24 z" stroke-width="1.1"/>
  </svg>`;

async function render() {
  const data = await fetch('plays.json').then(r => r.json());
  fill('playsGrid', data.plays || []);
  fill('viewsGrid', data.views || []);
}

function fill(gridId, items) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = items.map(it => `
    <a class="entry" href="${it.path}">
      <span class="entry-glyph">${GLYPHS[it.id] || GLYPH_FALLBACK}</span>
      <span class="entry-name">${it.name}</span>
    </a>
  `).join('');
}

render();
</script>

</body>
</html>
