<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下班娱乐抽签</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="抽签">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1410;
    color: #f5f0e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #4a3d30;
    background: #2a2119;
    color: #f5f0e8;
    resize: vertical;
    font-family: inherit;
  }
  .pool-label {
    font-size: 13px;
    color: #b8a892;
    margin-bottom: 6px;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 2rem 0 1rem;
  }
  .box {
    width: 160px;
    height: 160px;
    border-radius: 24px;
    background: #FAECE7;
    border: 3px solid #D85A30;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    color: #993C1D;
    transition: transform 0.08s;
  }
  .result {
    font-size: 26px;
    font-weight: 600;
    min-height: 34px;
    text-align: center;
  }
  .timer {
    font-size: 44px;
    font-weight: 600;
    display: none;
    color: #FF7A45;
  }
  .feedback {
    display: none;
    gap: 12px;
  }
  button {
    font-family: inherit;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #drawBtn {
    font-weight: 600;
    font-size: 17px;
    padding: 14px 36px;
    background: #D85A30;
    color: #fff;
    border: none;
  }
  #drawBtn:active { transform: scale(0.96); }
  #doneBtn {
    background: #3B6D11;
    color: #fff;
    border: none;
  }
  #skipDoneBtn {
    background: #A32D2D;
    color: #fff;
    border: none;
  }
  .stats {
    font-size: 13px;
    color: #b8a892;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="pool-label">备选池（可编辑，每行一项）</div>
  <textarea id="pool" rows="7">弹钢琴
唱歌
雅思单词
看书
画画
涂指甲油
收拾屋子</textarea>

  <div class="stage">
    <div id="box" class="box">🎁</div>
    <div id="result" class="result"></div>
    <div id="timer" class="timer"></div>
    <div id="feedback" class="feedback">
      <button id="doneBtn">✓ 做了</button>
      <button id="skipDoneBtn">✕ 没做</button>
    </div>
    <button id="drawBtn">🎲 抽签</button>
    <div id="stats" class="stats"></div>
  </div>
</div>

<script>
// ==== 在这里填入你的 Supabase 项目信息（见 README.md）====
const SUPABASE_URL = 'https://biiarbusbmdnqyjfnhax.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gKU7fggwQQX73nVZnApvxg_QdeH438A';
// ==========================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const pool = document.getElementById('pool');
const box = document.getElementById('box');
const result = document.getElementById('result');
const timerEl = document.getElementById('timer');
const drawBtn = document.getElementById('drawBtn');
const feedback = document.getElementById('feedback');
const doneBtn = document.getElementById('doneBtn');
const skipDoneBtn = document.getElementById('skipDoneBtn');
const statsEl = document.getElementById('stats');

let countdownId = null;
let currentPick = null;

function getItems() {
  return pool.value.split('\n').map(s => s.trim()).filter(Boolean);
}

async function logResult(activity, status) {
  if (!db) return;
  try {
    await db.from('lottery_log').insert({ activity: activity, status: status });
  } catch (e) {
    console.error('写入数据库失败', e);
  }
}

async function renderStats() {
  if (!db) {
    statsEl.textContent = '未连接数据库（见 README 配置 Supabase）';
    return;
  }
  try {
    const { data, error } = await db.from('lottery_log').select('status');
    if (error) throw error;
    const done = data.filter(r => r.status === 'done').length;
    const skipped = data.filter(r => r.status === 'skip').length;
    statsEl.textContent = (done + skipped) > 0
      ? '累计完成 ' + done + ' 次，跳过 ' + skipped + ' 次'
      : '';
  } catch (e) {
    statsEl.textContent = '统计加载失败';
  }
}

function stopTimer() {
  if (countdownId) { clearInterval(countdownId); countdownId = null; }
}

function startTimer(minutes) {
  stopTimer();
  let remaining = minutes * 60;
  timerEl.style.display = 'block';
  function render() {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    timerEl.textContent = m + ':' + String(s).padStart(2, '0');
  }
  render();
  countdownId = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      stopTimer();
      timerEl.textContent = '时间到';
      feedback.style.display = 'flex';
      drawBtn.style.display = 'none';
      return;
    }
    render();
  }, 1000);
}

drawBtn.addEventListener('click', () => {
  const items = getItems();
  if (items.length === 0) return;
  stopTimer();
  timerEl.style.display = 'none';
  feedback.style.display = 'none';
  drawBtn.style.display = 'inline-block';
  result.textContent = '';
  let spins = 0;
  const maxSpins = 20;
  const spinId = setInterval(() => {
    const pick = items[Math.floor(Math.random() * items.length)];
    currentPick = pick;
    result.textContent = pick;
    const scale = 1 + (spins % 3) * 0.09;
    const rot = (spins % 2 === 0 ? 1 : -1) * (7 - spins * 0.2);
    box.style.transform = 'scale(' + scale + ') rotate(' + rot + 'deg)';
    spins += 1;
    if (spins >= maxSpins) {
      clearInterval(spinId);
      box.style.transform = 'scale(1.2) rotate(0deg)';
      setTimeout(() => { box.style.transform = 'scale(1) rotate(0deg)'; }, 150);
      startTimer(30);
    }
  }, 75);
});

doneBtn.addEventListener('click', async () => {
  await logResult(currentPick, 'done');
  await renderStats();
  feedback.style.display = 'none';
  result.textContent = '完成：' + currentPick;
});

skipDoneBtn.addEventListener('click', async () => {
  await logResult(currentPick, 'skip');
  await renderStats();
  feedback.style.display = 'none';
  result.textContent = '没做：' + currentPick;
});

renderStats();
</script>

</body>
</html>
