<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lab-play</title>
<link rel="stylesheet" href="design/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
  /* 主菜单：字少图多。删掉所有说明文字，只留 SVG 纹样 + 名字 + 大留白。
     这是个人游戏系统，玩家只有自己，不需要说明。
     所有取值来自 design/tokens.css，本文件不写死颜色/间距。 */
  .shell {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--sp-9) var(--sp-5) var(--sp-8);
  }

  /* 极简报头：只留一个衬线字标，不带副标题 */
  .masthead {
    margin-bottom: var(--sp-9);
    text-align: center;
  }
  .masthead h1 {
    font-family: var(--font-serif);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-tight);
    margin: 0;
  }
  .owner-link {
    display: inline-block;
    margin-top: var(--sp-3);
    color: var(--c-text-faint);
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    transition: color var(--dur-fast) var(--ease-out);
  }
  .owner-link:hover { color: var(--c-accent); }

  .self-glance {
    max-width: var(--content-narrow);
    margin: 0 auto var(--sp-8);
  }
  .glance-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: var(--sp-3);
    color: var(--c-text-faint);
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
  }
  .glance-head a { transition: color var(--dur-fast) var(--ease-out); }
  .glance-head a:hover { color: var(--c-accent); }
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: var(--sp-2);
  }
  .day {
    display: grid;
    place-items: center;
    gap: var(--sp-1);
    padding: var(--sp-2) var(--sp-1);
    color: var(--c-text-faint);
    border-bottom: 1px solid var(--c-line);
    font-size: var(--fs-xs);
  }
  .day.today { color: var(--c-accent); border-color: var(--c-accent); }
  .day-mark {
    width: var(--sp-1);
    height: var(--sp-1);
    background: transparent;
    border-radius: var(--radius-full);
  }
  .day.has-event .day-mark { background: var(--c-positive); }

  /* 区块标签：极小、宽字距，作为分区而非解释 */
  .section-label {
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    color: var(--c-text-faint);
    text-align: center;
    margin: var(--sp-8) 0 var(--sp-5);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--sp-5);
  }

  /* 入口卡片：只有图形 + 名字，居中，慷慨留白 */
  .entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-4);
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-xl);
    padding: var(--sp-7) var(--sp-5);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out),
                transform var(--dur-base) var(--ease-out);
  }
  .entry:hover {
    border-color: var(--c-line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
  }
  /* SVG 纹样容器：矢量、随主题色、无外部资源 */
  .entry-glyph {
    width: 72px;
    height: 72px;
    color: var(--c-accent);
  }
  .entry-glyph svg { display: block; width: 100%; height: 100%; }
  .entry:hover .entry-glyph { color: var(--c-accent-hover); }

  .entry-name {
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    font-weight: var(--fw-medium);
    letter-spacing: var(--ls-tight);
  }
</style>
</head>
<body>

<div class="shell">
  <header class="masthead">
    <h1>lab · play</h1>
    <a class="owner-link" href="auth/">Owner</a>
  </header>

  <section class="self-glance" data-anchor="self-glance">
    <div class="glance-head">
      <span>This week</span>
      <a href="panels/stats/">Dashboard</a>
    </div>
    <div class="week" id="week"></div>
  </section>

  <div class="section-label">Plays</div>
  <div class="grid" id="playsGrid"></div>

  <div class="section-label">Panels</div>
  <div class="grid" id="panelsGrid"></div>
</div>

<script type="module">
import { queryEvents } from './core/events.js';
import { resolveHomeAnchor } from './skins/default.js';

// 主菜单由 plays.json 清单驱动：新增一个 play 只需在 plays.json 加一行，
// 这里自动渲染出入口，无需改动本文件。（见 AGENTS.md「如何新增一个 play」）
//
// 字少图多：每个入口只渲染 SVG 纹样 + 名字，不再渲染 desc / 状态标签。
// 图形按 anchor 从当前皮肤映射里取；没有对应纹样时回退到通用菱形。
// 纹样风格与卡牌世界观一致（菱形/牌形/线条构成），随主题色，非具象工具图标。
async function render() {
  const data = await fetch('plays.json', { cache: 'no-store' }).then(r => r.json());
  fill('playsGrid', data.plays || [], 'play');
  fill('panelsGrid', data.panels || [], 'panel');
}

function fill(gridId, items, kind) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = items.map(it => {
    const anchor = it.id === 'dashboard' ? 'dashboard' : `${kind}:${it.id}`;
    const visual = resolveHomeAnchor(anchor);
    return `
    <a class="entry" data-anchor="${anchor}" href="${it.path}">
      <span class="entry-glyph">${visual.glyph}</span>
      <span class="entry-name">${it.name}</span>
    </a>`;
  }).join('');
}

function startOfWeek(now = new Date()) {
  const start = new Date(now);
  const offset = (start.getDay() + 6) % 7;
  start.setDate(start.getDate() - offset);
  start.setHours(0, 0, 0, 0);
  return start;
}

function dayKey(date) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

async function renderSelfGlance() {
  const start = startOfWeek();
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  const events = await queryEvents({ from: start.toISOString(), to: end.toISOString() });
  const counts = new Map();
  for (const event of events) {
    const key = dayKey(new Date(event.created_at));
    counts.set(key, (counts.get(key) || 0) + 1);
  }

  const today = dayKey(new Date());
  const names = ['一', '二', '三', '四', '五', '六', '日'];
  document.getElementById('week').innerHTML = names.map((name, index) => {
    const date = new Date(start);
    date.setDate(start.getDate() + index);
    const count = counts.get(dayKey(date)) || 0;
    const classes = ['day', count ? 'has-event' : '', dayKey(date) === today ? 'today' : ''].filter(Boolean).join(' ');
    return `<span class="${classes}" title="${count} 条事件"><span>${name}</span><span>${date.getDate()}</span><i class="day-mark"></i></span>`;
  }).join('');
}

render();
renderSelfGlance().catch(error => {
  console.error('读取 self-glance 失败', error);
  document.querySelector('[data-anchor="self-glance"]').hidden = true;
});
</script>

</body>
</html>
