<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lab-play</title>
<link rel="stylesheet" href="design/tokens.css">
<style>
  /* 主菜单骨架样式。本轮只求“基调可见、结构清晰”，精美真 UI 留待后续。
     所有取值来自 design/tokens.css，本文件不写死颜色/间距。 */
  .shell {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--sp-9) var(--sp-5) var(--sp-8);
  }
  .masthead {
    margin-bottom: var(--sp-8);
  }
  .masthead h1 {
    font-family: var(--font-serif);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-tight);
    margin: 0 0 var(--sp-3);
  }
  .masthead p {
    margin: 0;
    max-width: var(--content-narrow);
    color: var(--c-text-muted);
    font-size: var(--fs-lg);
    line-height: var(--lh-base);
  }
  .section-label {
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    color: var(--c-text-faint);
    margin: var(--sp-7) 0 var(--sp-4);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--sp-4);
  }
  .entry {
    display: block;
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-lg);
    padding: var(--sp-5);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out),
                transform var(--dur-base) var(--ease-out);
  }
  .entry:hover {
    border-color: var(--c-line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .entry-icon {
    font-size: var(--fs-xl);
    color: var(--c-accent);
    line-height: 1;
  }
  .entry-name {
    font-size: var(--fs-lg);
    font-weight: var(--fw-medium);
    margin: var(--sp-3) 0 var(--sp-2);
  }
  .entry-desc {
    font-size: var(--fs-sm);
    color: var(--c-text-muted);
    margin: 0;
  }
  .tag-wip {
    display: inline-block;
    margin-top: var(--sp-3);
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    color: var(--c-accent);
    background: var(--c-accent-soft);
    padding: 2px var(--sp-2);
    border-radius: var(--radius-full);
  }
</style>
</head>
<body>

<div class="shell">
  <header class="masthead">
    <h1>lab · play</h1>
    <p>一个属于自己的游戏系统。把散落的“想做点什么”收敛成可玩、可回顾的玩法。</p>
  </header>

  <div class="section-label">玩法 · plays</div>
  <div class="grid" id="playsGrid"></div>

  <div class="section-label">账本视图 · views</div>
  <div class="grid" id="viewsGrid"></div>
</div>

<script type="module">
// 主菜单由 plays.json 清单驱动：新增一个 play 只需在 plays.json 加一行，
// 这里自动渲染出入口，无需改动本文件。（见 AGENTS.md「如何新增一个 play」）
async function render() {
  const data = await fetch('plays.json').then(r => r.json());
  fill('playsGrid', data.plays || []);
  fill('viewsGrid', data.views || []);
}

function fill(gridId, items) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = items.map(it => `
    <a class="entry" href="${it.path}">
      <div class="entry-icon">${it.icon || '◇'}</div>
      <div class="entry-name">${it.name}</div>
      <p class="entry-desc">${it.desc || ''}</p>
      ${it.status === 'wip' ? '<span class="tag-wip">开发中</span>' : ''}
    </a>
  `).join('');
}

render();
</script>

</body>
</html>
