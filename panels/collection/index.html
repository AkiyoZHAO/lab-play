<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection · lab-play</title>
<link rel="stylesheet" href="../../design/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .shell {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--sp-7) var(--sp-5) var(--sp-8);
  }
  .back {
    color: var(--c-text-muted);
    font-size: var(--fs-sm);
    transition: color var(--dur-fast) var(--ease-out);
  }
  .back:hover { color: var(--c-text); }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: var(--sp-5);
    margin: var(--sp-6) 0 var(--sp-7);
  }
  h1 {
    margin: 0;
    font-family: var(--font-serif);
    font-size: var(--fs-xl);
    letter-spacing: var(--ls-tight);
  }
  .summary { color: var(--c-text-muted); font-size: var(--fs-sm); }
  .summary strong {
    color: var(--c-accent);
    font-family: var(--font-serif);
    font-size: var(--fs-xl);
  }
  .status {
    padding: var(--sp-8) 0;
    color: var(--c-text-muted);
    font-size: var(--fs-sm);
    text-align: center;
  }
  .status.error { color: var(--c-negative); }
  .hidden { display: none; }
  .shelf-label {
    margin-bottom: var(--sp-4);
    color: var(--c-text-faint);
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: var(--sp-4);
  }
  .card {
    position: relative;
    min-height: 240px;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: var(--sp-5);
    padding: var(--sp-5);
    overflow: hidden;
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out);
  }
  .card.unlocked {
    border-color: var(--c-accent);
    box-shadow: var(--shadow-md);
  }
  .portrait {
    display: grid;
    place-items: center;
    color: var(--c-text-faint);
  }
  .unlocked .portrait { color: var(--c-accent); }
  .portrait svg { width: var(--sp-9); height: var(--sp-9); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--sp-3);
    margin-bottom: var(--sp-2);
  }
  .card-name {
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    letter-spacing: var(--ls-tight);
  }
  .card-state {
    color: var(--c-text-faint);
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
  }
  .unlocked .card-state { color: var(--c-accent); }
  .card-desc { color: var(--c-text-muted); font-size: var(--fs-sm); }
  .track {
    height: var(--sp-1);
    margin-top: var(--sp-4);
    overflow: hidden;
    background: var(--c-line);
    border-radius: var(--radius-full);
  }
  .fill {
    height: 100%;
    background: var(--c-positive);
    border-radius: var(--radius-full);
    transition: width var(--dur-slow) var(--ease-out);
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-top: var(--sp-2);
    color: var(--c-text-faint);
    font-size: var(--fs-xs);
  }
  .unlocked-date { color: var(--c-accent); }
  @media (max-width: 560px) {
    .head { align-items: flex-start; }
    .summary { text-align: right; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="shell">
  <a class="back" data-anchor="back" href="../../index.html">← Back</a>
  <header class="head">
    <h1>Collection</h1>
    <div class="summary"><strong id="unlocked">0</strong> / <span id="total">0</span> illuminated</div>
  </header>
  <div class="status" id="status">Loading collection…</div>
  <section class="hidden" id="collection">
    <div class="shelf-label">Figures</div>
    <div class="cards" id="cards"></div>
  </section>
</main>

<script type="module">
import { queryEvents } from '../../core/events.js';

const GLYPHS = {
  piano: `<svg viewBox="0 0 96 96" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 29c3-10 12-16 22-14 9 2 15 10 14 19-1 8-6 13-12 17v9"/>
    <path d="M37 32c0 7 4 13 11 15 7-2 11-8 11-15"/>
    <path d="M28 76c2-12 9-18 20-18s18 6 20 18"/>
    <path d="M17 77h62M20 82h56"/>
    <path d="M25 77v5m8-5v5m8-5v5m8-5v5m8-5v5m8-5v5m8-5v5" stroke-width="1"/>
  </svg>`,
};
const FALLBACK_GLYPH = `<svg viewBox="0 0 96 96" fill="none" stroke="currentColor"
    stroke-width="1.5" stroke-linejoin="round">
  <path d="M48 10 84 48 48 86 12 48z"/><path d="M48 27 69 48 48 69 27 48z"/>
</svg>`;

const statusEl = document.getElementById('status');
const collectionEl = document.getElementById('collection');
const cardsEl = document.getElementById('cards');

function esc(value) {
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatProgress(minutes, target) {
  const duration = value => {
    if (value < 60) return `${value}m`;
    const hours = Math.floor(value / 60);
    const rest = value % 60;
    return rest ? `${hours}h ${rest}m` : `${hours}h`;
  };
  const value = duration(minutes);
  const goal = duration(target);
  return `${value} / ${goal}`;
}

function dateLabel(value) {
  const date = new Date(value);
  return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
}

function evaluate(achievement, events) {
  const condition = achievement.condition || {};
  if (condition.type !== 'activity_minutes') return { value: 0, target: Number(condition.target) || 0, unlockedAt: null };

  let value = 0;
  let unlockedAt = null;
  const target = Number(condition.target) || 0;
  for (const event of events) {
    if (event.type !== 'draw_done' || event.payload?.activity !== condition.activity) continue;
    value += Number(event.payload?.duration) || 0;
    if (!unlockedAt && value >= target) unlockedAt = event.created_at;
  }
  return { value, target, unlockedAt };
}

async function load() {
  const [catalog, events] = await Promise.all([
    fetch('./achievements.json', { cache: 'no-store' }).then(response => response.json()),
    queryEvents({ play: 'draw', limit: 10000 }),
  ]);
  const achievements = catalog.achievements || [];
  let unlocked = 0;

  cardsEl.innerHTML = achievements.map(achievement => {
    const result = evaluate(achievement, events);
    const isUnlocked = Boolean(result.unlockedAt);
    if (isUnlocked) unlocked++;
    const percent = result.target ? Math.min(100, result.value / result.target * 100) : 0;
    return `<article class="card${isUnlocked ? ' unlocked' : ''}" data-anchor="collection:${achievement.id}">
      <div class="portrait">${GLYPHS[achievement.glyph] || FALLBACK_GLYPH}</div>
      <div>
        <div class="card-top">
          <span class="card-name">${esc(achievement.name)}</span>
          <span class="card-state">${isUnlocked ? 'Illuminated' : 'Dormant'}</span>
        </div>
        <div class="card-desc">${esc(achievement.description)}</div>
        <div class="track"><div class="fill" style="width:${percent}%"></div></div>
        <div class="progress-row">
          <span>${formatProgress(result.value, result.target)}</span>
          <span class="${isUnlocked ? 'unlocked-date' : ''}">${isUnlocked ? dateLabel(result.unlockedAt) : `${Math.round(percent)}%`}</span>
        </div>
      </div>
    </article>`;
  }).join('');

  document.getElementById('unlocked').textContent = unlocked;
  document.getElementById('total').textContent = achievements.length;
  statusEl.classList.add('hidden');
  collectionEl.classList.remove('hidden');
}

load().catch(error => {
  console.error(error);
  statusEl.textContent = 'Failed to load collection.';
  statusEl.classList.add('error');
});
</script>
</body>
</html>
