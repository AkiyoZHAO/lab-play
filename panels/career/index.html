<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career · lab-play</title>
<link rel="stylesheet" href="../../design/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* 事业面板：概览读 frontmatter（方案 B），点卡片下钻读同一份 md 的正文段。
     文案极简，状态 5 档用现有墨色阶由浅到深（DESIGN.md〔六〕），不写死颜色。 */
  .shell {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--sp-7) var(--sp-5) var(--sp-8);
  }
  .back {
    display: inline-block;
    font-size: var(--fs-sm);
    color: var(--c-text-muted);
    cursor: pointer;
    transition: color var(--dur-fast) var(--ease-out);
  }
  .back:hover { color: var(--c-text); }
  h1 {
    font-family: var(--font-serif);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-tight);
    margin: var(--sp-6) 0 var(--sp-7);
  }

  .status {
    color: var(--c-text-muted);
    font-size: var(--fs-sm);
    padding: var(--sp-8) 0;
    text-align: center;
  }
  .status.error { color: var(--c-negative); }
  .hidden { display: none; }

  /* 仪表盘：等级 / RTO / 通关 */
  .dash {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-5);
    padding-bottom: var(--sp-6);
    margin-bottom: var(--sp-6);
    border-bottom: 1px solid var(--c-line);
  }
  .dash-label {
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    color: var(--c-text-faint);
    margin-bottom: var(--sp-3);
  }
  .dash-value {
    font-family: var(--font-serif);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-tight);
    line-height: var(--lh-tight);
  }
  .pips { display: flex; gap: var(--sp-1); margin-top: var(--sp-3); }
  .pip {
    flex: 1;
    height: var(--sp-2);
    border-radius: var(--radius-full);
    background: var(--c-line);
  }
  .pip.on { background: var(--c-accent); }

  .next { margin-bottom: var(--sp-7); }
  .next .dash-label { margin-bottom: var(--sp-2); }
  .next-text { font-size: var(--fs-sm); }
  .next-text.empty { color: var(--c-text-faint); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--sp-4);
  }
  /* 卡片可点：hover 抬起 + 描边加重，和主菜单入口一致的语言 */
  .card {
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-lg);
    padding: var(--sp-5);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out),
                transform var(--dur-base) var(--ease-out);
  }
  .card:hover {
    border-color: var(--c-line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
  }
  .card-idx {
    font-family: var(--font-serif);
    font-size: var(--fs-xs);
    color: var(--c-text-faint);
    margin-right: var(--sp-1);
  }
  .card-name {
    font-size: var(--fs-base);
    font-weight: var(--fw-medium);
    letter-spacing: var(--ls-tight);
  }

  /* 状态 badge：5 档墨色由浅到深，全部取自现有 token */
  .badge {
    font-size: var(--fs-xs);
    letter-spacing: var(--ls-wide);
    padding: 2px var(--sp-3);
    border-radius: var(--radius-full);
    border: 1px solid var(--c-line);
    white-space: nowrap;
  }
  .badge.st-empty       { background: var(--c-surface-alt);   color: var(--c-text-faint); border-color: var(--c-line); }
  .badge.st-mapped      { background: var(--rar-r-surface);   color: var(--rar-r-ink);    border-color: var(--rar-r-line); }
  .badge.st-built       { background: var(--rar-all-surface); color: var(--rar-all-ink);  border-color: var(--rar-all-line); }
  .badge.st-tested      { background: var(--rar-sr-surface);  color: var(--rar-sr-ink);   border-color: var(--rar-sr-line); }
  .badge.st-maintained  { background: var(--rar-ssr-surface); color: var(--rar-ssr-ink);  border-color: var(--rar-ssr-line); }

  .dod { display: flex; align-items: center; gap: var(--sp-3); }
  .dod-track {
    flex: 1;
    height: var(--sp-1);
    background: var(--c-surface-alt);
    border-radius: var(--radius-full);
    overflow: hidden;
  }
  .dod-fill { height: 100%; background: var(--c-accent); border-radius: var(--radius-full); }
  .dod-num {
    font-size: var(--fs-xs);
    color: var(--c-text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── 下钻详情：把 md 正文段渲染成 HTML，样式全用 token ── */
  #detail .back { margin-bottom: var(--sp-5); }
  .prose { font-size: var(--fs-sm); line-height: var(--lh-base); }
  .prose > :first-child { margin-top: 0; }
  .prose h1 {
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    margin: 0 0 var(--sp-5);
    letter-spacing: var(--ls-tight);
  }
  .prose h2 {
    font-size: var(--fs-base);
    font-weight: var(--fw-bold);
    margin: var(--sp-6) 0 var(--sp-3);
  }
  .prose h3 {
    font-size: var(--fs-sm);
    font-weight: var(--fw-bold);
    color: var(--c-text-muted);
    margin: var(--sp-5) 0 var(--sp-2);
  }
  .prose p { margin: var(--sp-3) 0; }
  .prose ul, .prose ol { margin: var(--sp-3) 0; padding-left: var(--sp-5); }
  .prose li { margin: var(--sp-1) 0; }
  .prose li input[type="checkbox"] { margin-right: var(--sp-2); }
  .prose blockquote {
    margin: var(--sp-3) 0;
    padding: var(--sp-1) var(--sp-4);
    border-left: 2px solid var(--c-line-strong);
    color: var(--c-text-muted);
  }
  .prose code {
    background: var(--c-surface-alt);
    border-radius: var(--radius-sm);
    padding: 1px var(--sp-1);
    font-size: 0.9em;
  }
  .prose hr { border: none; border-top: 1px solid var(--c-line); margin: var(--sp-6) 0; }
  /* 表格：横向可滚，描边克制，表头浅底 */
  .prose table {
    width: 100%;
    border-collapse: collapse;
    margin: var(--sp-4) 0;
    font-size: var(--fs-xs);
  }
  .prose th, .prose td {
    border: 1px solid var(--c-line);
    padding: var(--sp-2) var(--sp-3);
    text-align: left;
    vertical-align: top;
  }
  .prose th { background: var(--c-surface-alt); font-weight: var(--fw-medium); white-space: nowrap; }
  .prose .table-wrap { overflow-x: auto; }

  @media (max-width: 720px) {
    .dash { grid-template-columns: 1fr; gap: var(--sp-6); }
  }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="../../index.html">← Back</a>
  <h1>Career</h1>

  <div class="status" id="status">Loading…</div>

  <div id="overview" class="hidden">
    <div class="dash">
      <div>
        <div class="dash-label">Level</div>
        <div class="dash-value" id="lvValue">—</div>
        <div class="pips" id="pips"></div>
      </div>
      <div>
        <div class="dash-label">RTO</div>
        <div class="dash-value" id="rtoValue">—</div>
      </div>
      <div>
        <div class="dash-label">Unlock</div>
        <div class="dash-value" id="actValue">—</div>
      </div>
    </div>

    <div class="next">
      <div class="dash-label">Next</div>
      <div class="next-text" id="nextText"></div>
    </div>

    <div class="cards" id="cards"></div>
  </div>

  <div id="detail" class="hidden">
    <a class="back" id="toOverview">↑ Overview</a>
    <div class="prose" id="detailBody"></div>
  </div>
</div>

<script>
// 序号 + 展示名（顺序即文档顺序，与 frontmatter sections 的 key 一致）
const SECTION_META = {
  market_map:          { idx: 1, name: 'Market Map' },
  target_positioning:  { idx: 2, name: 'Target Positioning' },
  capability_map:      { idx: 3, name: 'Capability Map' },
  evidence_bank:       { idx: 4, name: 'Evidence Bank' },
  resume_pack:         { idx: 5, name: 'Resume Pack' },
  interview_readiness: { idx: 6, name: 'Interview Readiness' },
  opportunity_access:  { idx: 7, name: 'Opportunity Access' },
  decision_framework:  { idx: 8, name: 'Decision Framework' },
  maintenance:         { idx: 9, name: 'Maintenance' },
};

const STATUS_META = {
  EMPTY:       { label: 'Empty',      cls: 'st-empty' },
  MAPPED:      { label: 'Mapped',     cls: 'st-mapped' },
  BUILT:       { label: 'Built',      cls: 'st-built' },
  TESTED:      { label: 'Tested',     cls: 'st-tested' },
  MAINTAINED:  { label: 'Maintained', cls: 'st-maintained' },
};

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function parseDod(str) {
  const m = String(str || '').match(/(\d+)\s*\/\s*(\d+)/);
  if (!m) return { done: 0, total: 0 };
  return { done: Number(m[1]), total: Number(m[2]) };
}

// 把 md 正文（frontmatter 之后）按 `---` 切块，取形如 `# N. Title` 的编号段，按序号存
function parseBodySections(body) {
  const byIdx = {};
  for (const chunk of body.split(/\r?\n---\r?\n/)) {
    const m = chunk.trim().match(/^#\s+(\d+)\.\s+.+/);
    if (m) byIdx[Number(m[1])] = chunk.trim();
  }
  return byIdx;
}

const statusEl   = document.getElementById('status');
const overviewEl = document.getElementById('overview');
const detailEl   = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
let bodyByIdx = {};

function showDetail(key) {
  const idx = SECTION_META[key]?.idx;
  const md = bodyByIdx[idx];
  if (!md) return;
  // 表格套一层 .table-wrap 以便窄屏横向滚动
  detailBody.innerHTML = marked.parse(md)
    .replace(/<table>/g, '<div class="table-wrap"><table>')
    .replace(/<\/table>/g, '</table></div>');
  overviewEl.classList.add('hidden');
  detailEl.classList.remove('hidden');
  window.scrollTo(0, 0);
}

function showOverview() {
  detailEl.classList.add('hidden');
  overviewEl.classList.remove('hidden');
  window.scrollTo(0, 0);
}

document.getElementById('toOverview').addEventListener('click', showOverview);

function render(fm) {
  const lv = Math.max(0, Math.min(5, Number(fm.readiness_level) || 0));
  document.getElementById('lvValue').textContent = `Lv.${lv} / 5`;
  document.getElementById('pips').innerHTML =
    Array.from({ length: 5 }, (_, i) =>
      `<span class="pip${i < lv ? ' on' : ''}"></span>`).join('');

  const rto = fm.career_rto;
  document.getElementById('rtoValue').textContent =
    (rto == null || rto === 'unknown' || rto === '') ? 'Unknown' : String(rto);

  const actVals = Object.values(fm.activation || {});
  document.getElementById('actValue').textContent =
    `${actVals.filter(Boolean).length} / ${actVals.length}`;

  const nextEl = document.getElementById('nextText');
  if (fm.next_action) {
    nextEl.textContent = fm.next_action;
    nextEl.classList.remove('empty');
  } else {
    nextEl.textContent = '—';
    nextEl.classList.add('empty');
  }

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = Object.entries(fm.sections || {}).map(([key, s]) => {
    const meta = SECTION_META[key] || { idx: '', name: key };
    const st = STATUS_META[s.status] || STATUS_META.EMPTY;
    const { done, total } = parseDod(s.dod);
    const pct = total ? (done / total) * 100 : 0;
    const clickable = bodyByIdx[meta.idx] ? ' data-key="' + key + '"' : '';
    return `<div class="card"${clickable}>
      <div class="card-head">
        <span><span class="card-idx">${meta.idx}</span><span class="card-name">${esc(meta.name)}</span></span>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>
      <div class="dod">
        <div class="dod-track"><div class="dod-fill" style="width:${pct}%"></div></div>
        <span class="dod-num">${done}/${total}</span>
      </div>
    </div>`;
  }).join('');

  cardsEl.addEventListener('click', (e) => {
    const card = e.target.closest('.card[data-key]');
    if (card) showDetail(card.dataset.key);
  });

  statusEl.classList.add('hidden');
  overviewEl.classList.remove('hidden');
}

(async () => {
  try {
    const res = await fetch('./career-turnaround.md', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    if (!m) throw new Error('no frontmatter');
    bodyByIdx = parseBodySections(text.slice(m[0].length));
    render(jsyaml.load(m[1]));
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Failed to load (open via a static server).';
    statusEl.classList.add('error');
  }
})();
</script>
</body>
</html>
