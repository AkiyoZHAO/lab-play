<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner · lab-play</title>
<link rel="stylesheet" href="../design/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
  .shell {
    max-width: var(--content-narrow);
    margin: 0 auto;
    padding: var(--sp-7) var(--sp-5) var(--sp-8);
  }
  .back {
    font-size: var(--fs-sm);
    color: var(--c-text-muted);
  }
  .back:hover { color: var(--c-text); }
  .card {
    margin-top: var(--sp-7);
    padding: var(--sp-6);
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-sm);
  }
  h1 {
    margin: 0 0 var(--sp-3);
    font-family: var(--font-serif);
    font-size: var(--fs-xl);
    letter-spacing: var(--ls-tight);
  }
  .hint, .status {
    color: var(--c-text-muted);
    font-size: var(--fs-sm);
  }
  .form {
    display: grid;
    gap: var(--sp-3);
    margin-top: var(--sp-5);
  }
  label {
    font-size: var(--fs-xs);
    color: var(--c-text-muted);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
  }
  input {
    width: 100%;
    padding: var(--sp-3) var(--sp-4);
    color: var(--c-text);
    background: var(--c-bg);
    border: 1px solid var(--c-line-strong);
    border-radius: var(--radius-md);
    font: inherit;
  }
  input:focus {
    outline: 2px solid var(--c-accent-soft);
    border-color: var(--c-accent);
  }
  button, .continue {
    display: inline-flex;
    justify-content: center;
    padding: var(--sp-3) var(--sp-5);
    border: 0;
    border-radius: var(--radius-md);
    background: var(--c-accent);
    color: var(--c-surface);
    font: inherit;
    font-weight: var(--fw-medium);
    transition: background var(--dur-base) var(--ease-out);
  }
  button:hover, .continue:hover { background: var(--c-accent-hover); }
  button:disabled { cursor: default; opacity: 0.55; }
  .secondary {
    background: var(--c-surface-alt);
    color: var(--c-text-muted);
    border: 1px solid var(--c-line);
  }
  .secondary:hover { background: var(--c-bg); }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-3);
    margin-top: var(--sp-5);
  }
  .status { min-height: var(--sp-5); margin-top: var(--sp-4); }
  .status.error { color: var(--c-negative); }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="shell">
  <a class="back" href="../">← Back</a>
  <section class="card">
    <h1>Owner</h1>

    <div id="signedOut">
      <p class="hint">使用预先授权的 Owner 账号登录。</p>
      <form class="form" id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" value="worryless10@gmail.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="signInBtn" type="submit">Sign in</button>
      </form>
    </div>

    <div class="hidden" id="signedIn">
      <p class="hint">已登录为 <span id="account"></span></p>
      <div class="actions">
        <a class="continue" id="continueLink" href="../">Continue</a>
        <button class="secondary" id="exportBtn" type="button">Export data</button>
        <button class="secondary" id="importBtn" type="button">Restore data</button>
        <button class="secondary" id="changePasswordBtn" type="button">Change password</button>
        <button class="secondary" id="signOutBtn" type="button">Sign out</button>
      </div>
      <input class="hidden" id="importFile" type="file" accept="application/json,.json">
    </div>

    <form class="form hidden" id="passwordForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
      <div class="actions">
        <button id="savePasswordBtn" type="submit">Save password</button>
        <button class="secondary" id="cancelPasswordBtn" type="button">Cancel</button>
      </div>
    </form>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script type="module">
import { getSession, isOwner, onAuthChange, signInWithPassword, signOut, updatePassword } from '../core/auth.js';
import { createBackup, downloadBackup, restoreBackup } from '../core/backup.js';

const signedOut = document.getElementById('signedOut');
const signedIn = document.getElementById('signedIn');
const loginForm = document.getElementById('loginForm');
const passwordForm = document.getElementById('passwordForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const signInBtn = document.getElementById('signInBtn');
const changePasswordBtn = document.getElementById('changePasswordBtn');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const savePasswordBtn = document.getElementById('savePasswordBtn');
const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
const newPasswordInput = document.getElementById('newPassword');
const confirmPasswordInput = document.getElementById('confirmPassword');
const signOutBtn = document.getElementById('signOutBtn');
const account = document.getElementById('account');
const statusEl = document.getElementById('status');
const continueLink = document.getElementById('continueLink');

function safeNext() {
  const fallback = new URL('../', location.href);
  const raw = new URLSearchParams(location.search).get('next');
  if (!raw) return fallback.href;
  const next = new URL(raw, location.href);
  return next.origin === location.origin ? next.href : fallback.href;
}

const nextUrl = safeNext();
continueLink.href = nextUrl;

function setStatus(message, error = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle('error', error);
}

function renderSession(session) {
  const owner = isOwner(session);
  signedOut.classList.toggle('hidden', Boolean(session));
  signedIn.classList.toggle('hidden', !session);
  passwordForm.classList.add('hidden');
  continueLink.classList.toggle('hidden', !owner);
  account.textContent = session?.user?.email || '';

  if (session && !owner) {
    setStatus('该账号没有 owner 权限。', true);
  } else if (owner) {
    setStatus('');
  } else {
    setStatus('');
  }
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  signInBtn.disabled = true;
  setStatus('正在登录…');
  try {
    const session = await signInWithPassword(emailInput.value.trim(), passwordInput.value);
    renderSession(session);
  } catch (error) {
    setStatus(error.message || '登录失败，请检查邮箱和密码。', true);
  } finally {
    signInBtn.disabled = false;
  }
});

changePasswordBtn.addEventListener('click', () => {
  signedIn.classList.add('hidden');
  passwordForm.classList.remove('hidden');
  setStatus('');
  newPasswordInput.focus();
});

cancelPasswordBtn.addEventListener('click', async () => renderSession(await getSession()));

passwordForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (newPasswordInput.value !== confirmPasswordInput.value) {
    setStatus('两次输入的密码不一致。', true);
    return;
  }
  savePasswordBtn.disabled = true;
  setStatus('正在保存…');
  try {
    await updatePassword(newPasswordInput.value);
    passwordForm.reset();
    renderSession(await getSession());
    setStatus('密码已更新。');
  } catch (error) {
    setStatus(error.message || '密码更新失败。', true);
  } finally {
    savePasswordBtn.disabled = false;
  }
});

exportBtn.addEventListener('click', async () => {
  exportBtn.disabled = true;
  setStatus('正在导出…');
  try {
    downloadBackup(await createBackup());
    setStatus('数据已导出。');
  } catch (error) {
    setStatus(error.message || '导出失败。', true);
  } finally {
    exportBtn.disabled = false;
  }
});

importBtn.addEventListener('click', () => importFile.click());

importFile.addEventListener('change', async () => {
  const file = importFile.files?.[0];
  if (!file) return;
  if (!confirm('恢复会按 id / panel 合并并覆盖同名记录，确定继续？')) {
    importFile.value = '';
    return;
  }
  importBtn.disabled = true;
  setStatus('正在恢复…');
  try {
    const result = await restoreBackup(JSON.parse(await file.text()));
    setStatus(`恢复完成：events ${result.events}，panel states ${result.panel_states}，private ${result.panel_private}。`);
  } catch (error) {
    setStatus(error.message || '恢复失败。', true);
  } finally {
    importBtn.disabled = false;
    importFile.value = '';
  }
});

signOutBtn.addEventListener('click', async () => {
  signOutBtn.disabled = true;
  try {
    await signOut();
    renderSession(null);
  } catch (error) {
    setStatus(error.message || '退出失败，请稍后重试。', true);
  } finally {
    signOutBtn.disabled = false;
  }
});

onAuthChange(session => renderSession(session));
renderSession(await getSession());
</script>
</body>
</html>
